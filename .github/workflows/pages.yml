name: Publicar Litoral-Okê

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair catálogo V14
        run: |
          rm -rf site temp
          mkdir site temp

          unzip -q LITORAL_OKE_V14_VISUAL_RESERVAS.zip -d temp

          ROOT=$(dirname "$(find temp -type f -name index.html -print -quit)")

          if [ -z "$ROOT" ] || [ "$ROOT" = "." ]; then
            echo "ERRO: index.html não encontrado dentro do ZIP."
            exit 1
          fi

          cp -a "$ROOT"/. site/

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
