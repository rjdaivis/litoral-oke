name: Publicar Litoral-Okê

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar V15
        run: |
          set -e

          rm -rf site temp
          mkdir -p site temp

          unzip -q LITORAL_OKE_V15_VISUAL_RESERVAS.zip -d temp

          INDEX=$(find temp -type f -name "index.html" -print -quit)

          if [ -z "$INDEX" ]; then
            echo "ERRO: index.html não encontrado."
            exit 1
          fi

          ROOT=$(dirname "$INDEX")

          echo "V15 encontrada em: $ROOT"

          # Publica a V15 em uma pasta NOVA, sem o cache da versão antiga
          mkdir -p site/v15
          cp -a "$ROOT"/. site/v15/

          # Cria uma página inicial que encaminha para a V15
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <title>LITORAL-OKÊ</title>
            <meta http-equiv="refresh" content="0;url=./v15/">
          </head>
          <body>
            <script>
              location.replace('./v15/?v=15');
            </script>
            Abrindo LITORAL-OKÊ...
          </body>
          </html>
          EOF

          echo "Conteúdo publicado:"
          find site -maxdepth 2 -type f | head -100

      - name: Verificar V15
        run: |
          set -e

          test -f site/index.html
          test -f site/v15/index.html
          test -f site/v15/assets/litoral-oke-v15.js
          test -f site/v15/assets/litoral-oke-v15.css

          echo "V15 verificada com sucesso."

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
